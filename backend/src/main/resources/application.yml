spring:
  application:
    name: SolveStack
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${SOLVESTACK_DB_URL}
    username: ${SOLVESTACK_DB_USERNAME}
    password: ${SOLVESTACK_DB_PASSWORD}
    hikari:
      data-source-properties:
        "[logServerErrorDetail]": 'false'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  session:
    timeout: 10m
    jdbc:
      initialize-schema: never
solvestack:
  session:
    cookie-secure: ${SOLVESTACK_SESSION_COOKIE_SECURE:true}
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
