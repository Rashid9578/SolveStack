apiVersion: v1
kind: PersistentVolume
metadata:
  name: solvestack-postgres-local
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: solvestack
    name: data-postgres-0
  local:
    path: /var/lib/solvestack/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [replace-with-node-hostname]
